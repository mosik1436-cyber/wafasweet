<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wafa Sweets</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Amiri', serif; color:#333; background:#fff; min-height:100vh; overflow-x:hidden; }

  /* Floating bakery background */
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg span { position:absolute; bottom:-60px; font-size:32px; opacity:.22;
             animation: floatUp linear infinite; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-115vh) rotate(360deg); }
  }

  .page { position:relative; z-index:1; }
  .header { background:#f8bbd0; padding:40px 20px 30px; text-align:center; overflow:hidden; position:relative; }
  .header .bg-h { position:absolute; inset:0; pointer-events:none; }
  .header .bg-h span { position:absolute; bottom:-50px; font-size:30px; opacity:.45;
                       animation: floatUp linear infinite; }
  .header > *:not(.bg-h) { position:relative; }
  .header h1 { margin:0 0 10px; color:#d81b60; font-family:'Great Vibes', cursive; font-weight:400; font-size:3.2em; }
  .header h2 { margin:0 0 8px; font-family:'Aref Ruqaa', serif; font-size:1.6em; color:#880e4f; }
  .header p { margin:0; font-size:1.1em; color:#555; }

  .links { max-width:420px; margin:20px auto; padding:0 16px; }
  .link { display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:14px;
          border-radius:12px; background:#fff; text-decoration:none; color:#333;
          box-shadow:0 1px 6px rgba(0,0,0,.15); transition:transform .15s; }
  .link:active { transform:scale(.98); }
  .icon { width:44px; height:44px; border-radius:50%; color:#fff; font-weight:bold;
          display:flex; align-items:center; justify-content:center; font-size:1.1em; font-family:Arial, sans-serif; }
  .ig { background:linear-gradient(45deg,#f09433,#dc2743,#bc1888); }
  .wa { background:#25d366; }
  .link small { display:block; color:#888; }

  .share { display:block; width:100%; margin-top:24px; padding:14px; border:none; border-radius:12px;
           background:#d81b60; color:#fff; font-family:'Amiri', serif; font-size:1.2em; font-weight:700;
           cursor:pointer; box-shadow:0 2px 8px rgba(216,27,96,.4); }
  .share:active { transform:scale(.98); }
  #msg { text-align:center; color:#880e4f; margin-top:10px; min-height:1.5em; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="page">
    <div class="header">
      <div class="bg-h" id="bgh"></div>
      <h1>Follow Us</h1>
      <h2>حلويات وفاء ترحب بكم بكل حب</h2>
      <p>تابعونا على مواقع التواصل الاجتماعي ليصلكم كل جديدنا</p>
    </div>

    <div class="links">
      <a class="link" href="https://www.instagram.com/wafassweet" target="_blank" rel="noopener">
        <div class="icon ig">IG</div>
        <div>Instagram<small>Follow us</small></div>
      </a>
      <a class="link" href="https://wa.me/212724315985" target="_blank" rel="noopener">
        <div class="icon wa">WA</div>
        <div>WhatsApp<small>Message us</small></div>
      </a>

      <button class="share" id="shareBtn">مشاركة الصفحة · Share</button>
      <div id="msg"></div>
    </div>
  </div>

<script>
  // Floating bakery icons
  const icons = ['🍞','🎂','🧁','🥐','🥣','🍰','🍪','🥖','🍩'];
  function fill(id, count) {
    const box = document.getElementById(id);
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.textContent = icons[i % icons.length];
      s.style.left = (Math.random() * 95) + '%';
      s.style.animationDuration = (10 + Math.random() * 12) + 's';
      s.style.animationDelay = (-Math.random() * 20) + 's';
      box.appendChild(s);
    }
  }
  fill('bg', 18);
  fill('bgh', 10);

  // Share button
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const data = { title: 'Wafa Sweets', text: 'حلويات وفاء ترحب بكم بكل حب', url: location.href };
    const msg = document.getElementById('msg');
    try {
      if (navigator.share) {
        await navigator.share(data);
      } else {
        await navigator.clipboard.writeText(location.href);
        msg.textContent = 'تم نسخ الرابط ✓';
        setTimeout(() => msg.textContent = '', 2500);
      }
    } catch (e) {}
  });
</script>
</body>
</html>
