<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wafa Sweets</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  html { background: #f8bbd0; }
  body { margin:0; font-family:'Amiri', serif; color:#4a2231; min-height:100vh; overflow-x:hidden;
         background: linear-gradient(180deg, #f4a6c4 0%, #f8bbd0 45%, #fde4ee 100%) fixed; }

  /* Floating bakery background */
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg span { position:absolute; bottom:-60px; font-size:32px; opacity:.3;
             animation: floatUp linear infinite; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-115vh) rotate(360deg); }
  }

  .page { position:relative; z-index:1; padding-bottom:40px; }
  .header { padding:44px 20px 18px; text-align:center; }
  .header h1 { margin:0 0 10px; color:#c2185b; font-family:'Great Vibes', cursive; font-weight:400; font-size:3.4em; }
  .header h2 { margin:0 0 8px; font-family:'Aref Ruqaa', serif; font-size:1.7em; color:#6a1b3d; }
  .header p { margin:0; font-size:1.15em; color:#6b4455; }

  .links { max-width:420px; margin:18px auto 0; padding:0 22px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
         padding:18px 16px; margin-bottom:16px; border-radius:22px; text-decoration:none; color:#fff;
         font-family:'Aref Ruqaa', serif; font-weight:700; font-size:1.3em;
         box-shadow:0 8px 20px rgba(0,0,0,.18); transition:transform .15s; border:none; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .btn svg { width:28px; height:28px; flex-shrink:0; }
  .wa { background:linear-gradient(135deg, #25a86b, #158a5a); }
  .ig { background:linear-gradient(135deg, #d6508f, #a84db5 60%, #7e57c2); }
  .share { background:linear-gradient(135deg, #e0608f, #c2185b); }
  #msg { text-align:center; color:#6a1b3d; min-height:1.5em; }

  .divider { display:flex; align-items:center; justify-content:center; gap:12px; margin:8px auto 22px; max-width:260px; }
  .divider i { flex:1; height:1px; background:#b8893a; }
  .divider b { color:#b8893a; font-size:1.1em; }

  .info { text-align:center; margin-top:18px; color:#6b4455; font-weight:700; line-height:1.9; }
  .info .fr { font-family:Arial, sans-serif; font-weight:400; font-size:.95em; letter-spacing:.3px; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="page">
    <div class="header">
      <h1>Follow Us</h1>
      <h2>حلويات وفاء ترحب بكم بكل حب</h2>
      <p>تابعونا على مواقع التواصل الاجتماعي ليصلكم كل جديدنا</p>
    </div>

    <div class="links">
      <div class="divider"><i></i><b>♥</b><i></i></div>

      <a class="btn wa" href="https://wa.me/212724315985" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        تواصل معنا على واتساب
      </a>

      <a class="btn ig" href="https://www.instagram.com/wafassweet" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg>
        تابعنا على انستغرام
      </a>

      <button class="btn share" id="shareBtn">مشاركة الصفحة</button>
      <div id="msg"></div>

      <div class="info">
        <div dir="ltr">+212 724 315 985</div>
        <div>أكادير - بلفاع</div>
        <div class="fr" dir="ltr">Agadir - Belfaa</div>
      </div>
    </div>
  </div>

<script>
  // Floating bakery icons
  const icons = ['🍞','🎂','🧁','🥐','🥣','🍰','🍪','🥖','🍩'];
  const box = document.getElementById('bg');
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    s.textContent = icons[i % icons.length];
    s.style.left = (Math.random() * 95) + '%';
    s.style.animationDuration = (10 + Math.random() * 12) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    box.appendChild(s);
  }

  // Share button
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const data = { title: 'Wafa Sweets', text: 'حلويات وفاء ترحب بكم بكل حب', url: location.href };
    const msg = document.getElementById('msg');
    try {
      if (navigator.share) {
        await navigator.share(data);
      } else {
        await navigator.clipboard.writeText(location.href);
        msg.textContent = 'تم نسخ الرابط ✓';
        setTimeout(() => msg.textContent = '', 2500);
      }
    } catch (e) {}
  });
</script>
</body>
</html>
